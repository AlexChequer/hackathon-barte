[project]
name = "tarvo-fechamento"
version = "0.1.0"
description = "Motor de fechamento mensal da Tarvo Pagamentos (Hackathon Barte AI, out/2026)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    # painel (python -m tarvo.web)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # rascunhos de envio a terceiros (P36); só chama a API com OPENAI_API_KEY
    "openai>=3.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]
# Classificador binário local (open source, Apache-2.0) para sinais de condição especial.
classificador = ["laya==0.4.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# front já compilado (web/ → src/tarvo/web/static): a banca não precisa de Node
"tarvo.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
